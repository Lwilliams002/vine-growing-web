# Publishes a static, prerendered copy of the site to GitHub Pages on every
# push to main. Test link: https://<owner>.github.io/<repo>/
#
# One-time setup in the GitHub repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     VITE_SUPABASE_URL              (Lovable Cloud / Supabase project URL)
#     VITE_SUPABASE_PUBLISHABLE_KEY  (its publishable / anon key)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          touch .output/public/.nojekyll
          # Deep links to unknown paths fall back to the app, which renders its own 404 page.
          cp .output/public/index.html .output/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
